name: core_ui
description: Shared UI kit - colors, fonts, theme, material_ui and cupertino_ui widgets.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.13.3
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  easy_localization: ^3.0.8
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  material_ui: ^1.2.0
  cupertino_ui: ^1.0.2
  shimmer: ^4.0.0
  carousel_slider: ^5.1.2
  dropdown_button2: ^3.1.0
  skeletonizer: ^2.1.3
  flutter_form_builder: ^11.0.0
  form_builder_validators: ^11.0.0
  flutter_map: ^8.3.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
