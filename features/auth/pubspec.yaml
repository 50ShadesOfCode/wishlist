name: auth
description: Auth feature - email/password, Google, Apple, change & restore password.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.13.3
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../../core
  core_ui:
    path: ../../core_ui
  material_ui: ^1.2.0
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  get_it: ^9.2.1
  easy_localization: ^3.0.8
  firebase_auth: ^6.6.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  flutter_form_builder: ^11.0.0
  form_builder_validators: ^11.0.0
  go_router: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
