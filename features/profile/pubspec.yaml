  flutter_form_builder: ^11.0.0
  form_builder_validators: ^11.0.0
  dropdown_button2: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  json_serializable: ^6.14.1
