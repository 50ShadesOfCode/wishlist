name: chat
description: Chat feature - secret wishlist discussions, photo sharing, Firebase backed.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.13.3
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../core
  core_ui:
    path: ../core_ui
  material_ui: ^1.2.0
  cupertino_ui: ^1.0.2
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  json_annotation: ^4.12.0
  get_it: ^9.2.1
  injectable: ^3.0.0
  easy_localization: ^3.0.8
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.12
  firebase_auth: ^5.6.0
  supabase_flutter: ^2.8.0
  image_picker: ^1.2.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  json_serializable: ^6.14.1
