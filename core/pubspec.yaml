name: core
description: Core package - failures, usecases, network, storage, utils for Wishlist app.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.13.3
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  equatable: ^2.1.0
  material_ui: ^1.2.0
  get_it: ^9.2.1
  connectivity_plus: ^7.3.1
  flutter_local_notifications: ^22.3.0
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5
  hive_ce: ^2.19.3
  logging: ^1.3.0
  # Imported only for exception types in src/error/map_failure.dart.
  supabase_flutter: ^2.8.0
  firebase_core: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
