name: wishlist_app
description: Wishlist application - create wishlists, connect, discuss in secret, map items.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.2.0
  core:
    path: core
  core_ui:
    path: core_ui
  auth:
    path: features/auth
  profile:
    path: features/profile
  wishlist:
    path: features/wishlist
  chat:
    path: features/chat
  flutter_bloc: ^9.1.1
  go_router: ^18.0.1
  get_it: ^9.2.1
  easy_localization: ^3.0.8
  flutter_local_notifications: ^22.3.1
  flutter_dotenv: ^6.0.1
  supabase_flutter: ^2.8.0
  firebase_core: ^4.14.0
  cloud_firestore: ^6.9.0
  firebase_auth: ^6.6.1
  hive_ce_flutter: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/translations/
