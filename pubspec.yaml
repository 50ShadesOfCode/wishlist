name: wishlist_app
description: Wishlist application - create wishlists, connect, discuss in secret, map items.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.2.0
  cupertino_ui: ^1.0.2
  cupertino_icons: ^1.0.9
  core:
    path: core
  core_ui:
    path: core_ui
  auth:
    path: features/auth
  profile:
    path: features/profile
  wishlist:
    path: features/wishlist
  chat:
    path: features/chat
  flutter_bloc: ^9.1.1
  go_router: ^18.0.1
  get_it: ^9.2.1
  injectable: ^3.0.0
  easy_localization: ^3.0.8
  flutter_local_notifications: ^22.3.0
  flutter_map: ^8.3.2
  geolocator: ^14.0.3
  local_auth: ^3.0.2
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  connectivity_plus: ^7.3.1
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  isar_plus: ^1.3.9
  flutter_svg: ^2.3.0
  shimmer: ^4.0.0
  carousel_slider: ^5.1.2
  dropdown_button2: ^3.1.0
  skeletonizer: ^2.1.3
  flutter_form_builder: ^11.0.0
  form_builder_validators: ^11.0.0
  equatable: ^2.1.0
  json_annotation: ^4.12.0
  logging: ^1.3.0
  flutter_dotenv: ^6.0.1
  supabase_flutter: ^2.8.0
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.12
  firebase_auth: ^5.6.0
  google_sign_in: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/translations/
    - assets/images/
    - assets/icons/
